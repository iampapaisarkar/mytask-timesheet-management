# Cloud Build — set secret values via Cloud Build substitutions / Secret Manager.
# Do not commit real credentials in this file.

substitutions:
  _TAG_NAME: "latest"
  _SERVICE_NAME: "mysheet-api-prod"
  _MYSHEET_API_URL: "https://mysheet-api-prod-460667421634.australia-southeast1.run.app"

steps:
  # Step 0: Pull the image for caching
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "docker pull australia-southeast1-docker.pkg.dev/mysheet-prod/mysheet-api/mysheet-api-image:${_TAG_NAME} || true"

  # Step 1: Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "mysheet-api:${_TAG_NAME}", "."]

  # Step 2: Tag the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "tag"
      - "mysheet-api:${_TAG_NAME}"
      - "australia-southeast1-docker.pkg.dev/mysheet-prod/mysheet-api/mysheet-api-image:${_TAG_NAME}"

  # Step 3: Push the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "australia-southeast1-docker.pkg.dev/mysheet-prod/mysheet-api/mysheet-api-image:${_TAG_NAME}"

  # Step 4: Deploy to Cloud Run
  # Prefer --set-secrets for DB_PASSWORD, MAIL_PASSWORD, CRON_SECRET, etc.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=australia-southeast1-docker.pkg.dev/mysheet-prod/mysheet-api/mysheet-api-image:${_TAG_NAME} \
          --platform=managed \
          --allow-unauthenticated \
          --region=australia-southeast1 \
          --memory=4Gi \
          --cpu=1 \
          --max-instances=10 \
          --add-cloudsql-instances=mysheet-prod:australia-southeast1:mysheet-mysql-prod \
          --set-env-vars="NODE_ENV=production" \
          --set-env-vars="DB_DIALECT=mysql" \
          --set-env-vars="DB_NAME=mysheet_prod" \
          --set-env-vars="DB_USER=mysheetuser" \
          --set-env-vars="DB_HOST=/cloudsql/mysheet-prod:australia-southeast1:mysheet-mysql-prod" \
          --set-env-vars="DB_PORT=3306" \
          --set-env-vars="APP_NAME=mySheet" \
          --set-env-vars="MYSHEET_API_URL=${_MYSHEET_API_URL}" \
          --set-env-vars="CLIENT_URL=https://app.mysheet.au/" \
          --set-env-vars="SERVER_URL=https://mysheet-api-prod-460667421634.australia-southeast1.run.app/api" \
          --set-env-vars="START_SERVER=true" \
          --set-env-vars="RUN_WORKERS=true" \
          --set-env-vars="FIREBASE_API_URL=https://identitytoolkit.googleapis.com/v1" \
          --set-env-vars="MAIL_HOST=smtp.sendgrid.net" \
          --set-env-vars="MAIL_PORT=587" \
          --set-env-vars="MAIL_USER=apikey" \
          --set-env-vars="ORG_DEFAULT_DAILY_LOG_FREQUENCY=8" \
          --set-env-vars="XERO_CALLBACK_URL=https://app.mysheet.au/xero/authenticate" \
          --set-env-vars="XERO_SCOPES=openid email profile offline_access payroll.employees payroll.payruns payroll.timesheets payroll.settings accounting.settings" \
          --set-env-vars="XERO_API_URL=https://api.xero.com/payroll.xro/2.0" \
          --set-secrets="DB_PASSWORD=mysheet-db-password:latest,CRON_SECRET=mysheet-cron-secret:latest,FIREBASE_API_KEY=mysheet-firebase-api-key:latest,SOCKETIO_TOKEN=mysheet-socketio-token:latest,MAIL_PASSWORD=mysheet-mail-password:latest,MAIL_FROM=mysheet-mail-from:latest,XERO_CLIENT_ID=mysheet-xero-client-id:latest,REDIS_HOST=mysheet-redis-host:latest"

options:
  machineType: "E2_MEDIUM"

images:
  - "australia-southeast1-docker.pkg.dev/mysheet-prod/mysheet-api/mysheet-api-image:${_TAG_NAME}"

timeout: "1200s"
