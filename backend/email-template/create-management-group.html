<tr>
  <td align="center">
    <table
      class="t10"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin-left: auto; margin-right: auto"
    >
      <tr>
        <td width="318" class="t9" style="width: 339px">
          <table
            class="t8"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="width: 100%"
          >
            <tr>
              <td class="t7">
                <h1
                  class="t6"
                  style="
                    margin: 0;
                    margin: 0;
                    font-family: Inter, BlinkMacSystemFont, Segoe UI,
                      Helvetica Neue, Arial, sans-serif;
                    line-height: 28px;
                    font-weight: 600;
                    font-style: normal;
                    font-size: 24px;
                    text-decoration: none;
                    text-transform: none;
                    letter-spacing: -1.2px;
                    direction: ltr;
                    color: #111111;
                    text-align: left;
                    mso-line-height-rule: exactly;
                    mso-text-raise: 1px;
                  "
                >
                  {{title}}
                </h1>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td>
    <div
      class="t12"
      style="
        mso-line-height-rule: exactly;
        mso-line-height-alt: 17px;
        line-height: 17px;
        font-size: 1px;
        display: block;
      "
    >
      &nbsp;&nbsp;
    </div>
  </td>
</tr>
<tr>
  <td align="center">
    <table
      class="t16"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin-left: auto; margin-right: auto"
    >
      <tr>
        <td width="308" class="t15" style="width: 308px">
          <table
            class="t14"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="width: 100%"
          >
            <tr>
              <td class="t13">
                <p
                  class="t11"
                  style="
                    margin: 0;
                    margin: 0;
                    font-family: Inter, BlinkMacSystemFont, Segoe UI,
                      Helvetica Neue, Arial, sans-serif;
                    line-height: 22px;
                    font-weight: 500;
                    font-style: normal;
                    font-size: 15px;
                    text-decoration: none;
                    text-transform: none;
                    letter-spacing: -0.6px;
                    direction: ltr;
                    color: #424040;
                    text-align: center;
                    mso-line-height-rule: exactly;
                    mso-text-raise: 2px;
                  "
                >
                  {{message}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td>
    <div
      class="t18"
      style="
        mso-line-height-rule: exactly;
        mso-line-height-alt: 40px;
        line-height: 40px;
        font-size: 1px;
        display: block;
      "
    >
      &nbsp;&nbsp;
    </div>
  </td>
</tr>
