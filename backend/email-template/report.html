<tr>
  <td align="center">
    <table
      class="t10"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin-left: auto; margin-right: auto"
    >
      <tr>
        <td width="340" class="t9" style="width: 340px">
          <table
            class="t8"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="width: 100%"
          >
            <tr>
              <td class="t7">
                <h1
                  class="t6"
                  style="
                    margin: 0;
                    font-family: Inter, BlinkMacSystemFont, Segoe UI,
                      Helvetica Neue, Arial, sans-serif;
                    line-height: 28px;
                    font-weight: 600;
                    font-size: 22px;
                    letter-spacing: -1px;
                    color: #111111;
                    text-align: left;
                  "
                >
                  {{title}}
                </h1>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td>
    <div
      style="
        mso-line-height-rule: exactly;
        line-height: 18px;
        font-size: 1px;
        display: block;
      "
    >
      &nbsp;
    </div>
  </td>
</tr>
<tr>
  <td align="center">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin-left: auto; margin-right: auto"
    >
      <tr>
        <td width="340" style="width: 340px">
          <div
            style="
              margin: 0;
              font-family: Inter, BlinkMacSystemFont, Segoe UI,
                Helvetica Neue, Arial, sans-serif;
              line-height: 22px;
              font-weight: 500;
              font-size: 14px;
              letter-spacing: -0.3px;
              color: #424040;
              text-align: left;
            "
          >
            {{message}}
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td>
    <div
      style="
        mso-line-height-rule: exactly;
        line-height: 28px;
        font-size: 1px;
        display: block;
      "
    >
      &nbsp;
    </div>
  </td>
</tr>
<tr>
  <td align="center">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin-left: auto; margin-right: auto"
    >
      <tr>
        <td width="180" style="width: 180px">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td
                style="
                  overflow: hidden;
                  background-color: #04b6b1;
                  text-align: center;
                  line-height: 42px;
                  border-radius: 8px;
                "
              >
                <a
                  href="{{button_url}}"
                  style="
                    display: block;
                    margin: 0;
                    font-family: Inter, BlinkMacSystemFont, Segoe UI,
                      Helvetica Neue, Arial, sans-serif;
                    line-height: 42px;
                    font-weight: 700;
                    font-size: 15px;
                    text-decoration: none;
                    color: #ffffff;
                    text-align: center;
                  "
                  target="_blank"
                  >{{button_label}}</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
